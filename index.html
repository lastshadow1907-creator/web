<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muly ❤️ Olcay</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fff0f3;
            --text-color: #593539;
            --card-bg: #ffffff;
            --accent-color: #ff4d6d;
            --accent-hover: #ff1a43;
            --shadow: 0 10px 30px rgba(255, 77, 109, 0.15);
            --border-color: #ffccd5;
        }

        [data-theme="dark"] {
            --bg-color: #0d1117;
            --text-color: #e6edf3;
            --card-bg: #161b22;
            --accent-color: #ff5874;
            --accent-hover: #ff758d;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px;
        }

        .theme-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            box-shadow: var(--shadow);
            z-index: 1000;
            font-size: 0.85rem;
        }

        .container {
            max-width: 600px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 50px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        h1 {
            font-family: 'Sacramento', cursive;
            font-size: 3.8rem;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        h3 {
            color: var(--accent-color);
            margin-bottom: 12px;
            font-size: 1.2rem;
            font-weight: 600;
        }

        p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .counter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .time-box {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .time-box span {
            display: block;
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .time-box label {
            font-size: 0.7rem;
            opacity: 0.8;
        }

        .anniversary-banner {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-weight: 500;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        input[type="text"], textarea {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            margin-top: 10px;
            outline: none;
            font-size: 0.9rem;
        }

        textarea {
            height: 90px;
            resize: none;
        }

        button.primary-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 11px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            margin-top: 12px;
            width: 100%;
            font-size: 0.95rem;
        }

        button.primary-btn:hover {
            background-color: var(--accent-hover);
        }

        .message-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
        }

        .message-item {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .message-item strong {
            color: var(--accent-color);
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body data-theme="light">

    <button class="theme-toggle" onclick="toggleTheme()">🌙 Tema Değiş</button>

    <div class="container">
        <!-- Başlık, Sayaç ve Yıldönümü -->
        <div class="card">
            <h1>Muly & Olcay</h1>
            <p>Birlikte Geçen Sonsuz Zamanımız ❤️</p>
            <div class="counter-grid">
                <div class="time-box"><span id="days">0</span><label>Gün</label></div>
                <div class="time-box"><span id="hours">0</span><label>Saat</label></div>
                <div class="time-box"><span id="minutes">0</span><label>Dakika</label></div>
                <div class="time-box"><span id="seconds">0</span><label>Saniye</label></div>
            </div>
            
            <div class="anniversary-banner" id="anniversaryCountdown">
                Yıldönümümüze kalan süre hesaplanıyor... ✨
            </div>
        </div>

        <!-- Site İçi Mektup ve Not Panosu -->
        <div class="card">
            <h3>Bizim Romantik Not & Mektup Panomuz ❤️</h3>
            <input type="text" id="senderName" placeholder="Adın (Muly veya Olcay)">
            <textarea id="noteInput" placeholder="Buraya tatlı bir mektup veya yapılacaklar listesi yazabilirsin..."></textarea>
            <button class="primary-btn" onclick="addMessage()">Notu / Mektubu Ekle ✨</button>

            <div class="message-list" id="messageList">
                <!-- Yazılanlar doğrudan sitede liste halinde görünecek -->
            </div>
        </div>
    </div>

    <script>
        const startDate = new Date("2026-03-14T00:08:00");

        function updateCounters() {
            const now = new Date();
            
            // İlişki Sayacı
            const diff = now - startDate;
            if (diff > 0) {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / 1000 / 60) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                document.getElementById("days").innerText = days;
                document.getElementById("hours").innerText = hours;
                document.getElementById("minutes").innerText = minutes;
                document.getElementById("seconds").innerText = seconds;
            }

            // Yıldönümüne Kalan Süre
            const currentYear = now.getFullYear();
            let nextAnniversary = new Date(currentYear, 2, 14, 0, 8, 0); 
            
            if (now > nextAnniversary) {
                nextAnniversary = new Date(currentYear + 1, 2, 14, 0, 8, 0);
            }

            const annivDiff = nextAnniversary - now;
            const annivDays = Math.floor(annivDiff / (1000 * 60 * 60 * 24));
            const annivHours = Math.floor((annivDiff / (1000 * 60 * 60)) % 24);
            const annivMins = Math.floor((annivDiff / 1000 / 60) % 60);

            document.getElementById("anniversaryCountdown").innerHTML = 
                `🎉 Gelecek Yıldönümümüze: <b>${annivDays} gün ${annivHours} saat ${annivMins} dakika</b> kaldı!`;
        }

        setInterval(updateCounters, 1000);
        updateCounters();

        // Tema Değiştirici
        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute("data-theme");
            const newTheme = currentTheme === "light" ? "dark" : "light";
            body.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
        }

        // Pano Mesajlarını Yönetme
        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem("finalRomanticBoard")) || [];
            const listContainer = document.getElementById("messageList");
            listContainer.innerHTML = "";

            if (messages.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; opacity:0.6; font-size:0.85rem; padding: 10px;">Henüz bir mektup veya not eklenmemiş. İlk tatlı sözü sen yaz! ❤️</p>';
                return;
            }

            messages.forEach((msg) => {
                const div = document.createElement("div");
                div.className = "message-item";
                div.innerHTML = `<strong>${msg.name}</strong> ${msg.text}`;
                listContainer.appendChild(div);
            });
        }

        function addMessage() {
            const name = document.getElementById("senderName").value.trim();
            const text = document.getElementById("noteInput").value.trim();

            if (!name || !text) {
                alert("Lütfen adını ve mesajını yaz knk! 😊");
                return;
            }

            const messages = JSON.parse(localStorage.getItem("finalRomanticBoard")) || [];
            messages.unshift({ name: name, text: text });
            localStorage.setItem("finalRomanticBoard", JSON.stringify(messages));

            document.getElementById("noteInput").value = "";
            loadMessages();
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem("theme") || "light";
            document.body.setAttribute("data-theme", savedTheme);
            loadMessages();
        };
    </script>
</body>
</html>
