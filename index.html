<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muly ❤️ Olcay</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fff0f3;
            --text-color: #593539;
            --card-bg: #ffffff;
            --accent-color: #ff4d6d;
            --accent-hover: #ff1a43;
            --shadow: 0 10px 30px rgba(255, 77, 109, 0.15);
            --border-color: #ffccd5;
        }

        [data-theme="dark"] {
            --bg-color: #0d1117;
            --text-color: #e6edf3;
            --card-bg: #161b22;
            --accent-color: #ff5874;
            --accent-hover: #ff758d;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            --border-color: #30363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background-color 0.3s, color 0.3s;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .theme-toggle {
            position: fixed;
            top: 15px;
            right: 15px;
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 12px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            box-shadow: var(--shadow);
            z-index: 1000;
            font-size: 0.85rem;
        }

        .container {
            max-width: 500px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        h1 {
            font-family: 'Sacramento', cursive;
            font-size: 3.5rem;
            color: var(--accent-color);
            margin-bottom: 5px;
        }

        p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .counter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .time-box {
            background: var(--bg-color);
            padding: 10px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .time-box span {
            display: block;
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .time-box label {
            font-size: 0.75rem;
            opacity: 0.8;
        }

        input[type="text"], textarea {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 12px;
            border-radius: 10px;
            font-family: 'Poppins', sans-serif;
            margin-top: 10px;
            outline: none;
        }

        textarea {
            height: 90px;
            resize: none;
        }

        button.primary-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            margin-top: 10px;
            width: 100%;
        }

        button.primary-btn:hover {
            background-color: var(--accent-hover);
        }

        .message-list {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 250px;
            overflow-y: auto;
            text-align: left;
        }

        .message-item {
            background: var(--bg-color);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
        }

        .message-item strong {
            color: var(--accent-color);
            display: block;
            margin-bottom: 4px;
        }
    </style>
</head>
<body data-theme="light">

    <button class="theme-toggle" onclick="toggleTheme()">🌙 Tema Değiş</button>

    <div class="container">
        <!-- Başlık ve Sayaç -->
        <div class="card">
            <h1>Muly & Olcay</h1>
            <p>Birlikte Geçen Sonsuz Zamanımız ❤️</p>
            <div class="counter-grid">
                <div class="time-box"><span id="days">0</span><label>Gün</label></div>
                <div class="time-box"><span id="hours">0</span><label>Saat</label></div>
                <div class="time-box"><span id="minutes">0</span><label>Dakika</label></div>
                <div class="time-box"><span id="seconds">0</span><label>Saniye</label></div>
            </div>
        </div>

        <!-- Ortak Mektup / Not Panosu -->
        <div class="card">
            <h3>Ortak Not & Mektup Panosu ❤️</h3>
            <input type="text" id="senderName" placeholder="Adınız (Muly veya Olcay)">
            <textarea id="noteInput" placeholder="Buraya ortak bir mektup veya not yazın..."></textarea>
            <button class="primary-btn" onclick="addMessage()">Not Ekle ve Listele</button>

            <div class="message-list" id="messageList">
                <!-- Yazılanlar burada liste halinde görünecek -->
            </div>
        </div>
    </div>

    <script>
        const startDate = new Date("2026-03-14T00:08:00");

        function updateCounter() {
            const now = new Date();
            const diff = now - startDate;

            if (diff > 0) {
                const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
                const minutes = Math.floor((diff / 1000 / 60) % 60);
                const seconds = Math.floor((diff / 1000) % 60);

                document.getElementById("days").innerText = days;
                document.getElementById("hours").innerText = hours;
                document.getElementById("minutes").innerText = minutes;
                document.getElementById("seconds").innerText = seconds;
            }
        }
        setInterval(updateCounter, 1000);
        updateCounter();

        function toggleTheme() {
            const body = document.body;
            const currentTheme = body.getAttribute("data-theme");
            const newTheme = currentTheme === "light" ? "dark" : "light";
            body.setAttribute("data-theme", newTheme);
            localStorage.setItem("theme", newTheme);
        }

        // Notları Kaydetme ve Listeleme Sistemi
        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem("sharedMessages")) || [];
            const listContainer = document.getElementById("messageList");
            listContainer.innerHTML = "";

            if (messages.length === 0) {
                listContainer.innerHTML = '<p style="text-align:center; opacity:0.6; font-size:0.85rem;">Henüz bir not eklenmemiş. İlk notu sen yaz! ❤️</p>';
                return;
            }

            messages.forEach((msg) => {
                const div = document.createElement("div");
                div.className = "message-item";
                div.innerHTML = `<strong>${msg.name}</strong> ${msg.text}`;
                listContainer.appendChild(div);
            });
        }

        function addMessage() {
            const name = document.getElementById("senderName").value.trim();
            const text = document.getElementById("noteInput").value.trim();

            if (!name || !text) {
                alert("Lütfen adınızı ve mesajınızı yazın knk!");
                return;
            }

            const messages = JSON.parse(localStorage.getItem("sharedMessages")) || [];
            messages.unshift({ name: name, text: text }); // En yeni eklenen üste gelir
            localStorage.setItem("sharedMessages", JSON.stringify(messages));

            document.getElementById("noteInput").value = "";
            loadMessages();
        }

        window.onload = function() {
            const savedTheme = localStorage.getItem("theme") || "light";
            document.body.setAttribute("data-theme", savedTheme);
            loadMessages();
        };
    </script>
</body>
</html>
